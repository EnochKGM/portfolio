<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08070d">
  <meta name="description" content="Enoch K Resume">
  <title>Enoch K — Resume</title>

  <link rel="icon" href="icon.ico" type="image/x-icon">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Rethink+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#08070d;
      --surface:#111018;
      --surface-2:#171520;
      --text:#f7f3ff;
      --muted:#aaa5b7;
      --line:rgba(255,255,255,.085);
      --purple:#9b6cff;
      --purple-2:#c8adff;
      --purple-3:#7042e8;
      --max:1180px;
      --nav-h:58px;
    }

    *{box-sizing:border-box}

    html{
      scroll-behavior:smooth;
    }

    body{
      margin:0;
      color:var(--text);
      background:
      radial-gradient(circle at 80% 8%,rgba(125,80,255,.16),transparent 28rem),
      radial-gradient(circle at 8% 45%,rgba(80,55,150,.10),transparent 28rem),
      var(--bg);
      font-family:"Rethink Sans",system-ui,sans-serif;
      -webkit-font-smoothing:antialiased;
      overflow-x:hidden;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:.035;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");
      z-index:30;
    }

    body::after{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background:radial-gradient(
        380px circle at var(--mx,50%) var(--my,30%),
        rgba(155,108,255,.075),
        transparent 70%
      );
      z-index:-1;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    .container{
      width:min(var(--max),calc(100% - 40px));
      margin:auto;
    }

    /* NAV */

    .nav{
      position:sticky;
      top:14px;
      z-index:20;
      margin-top:14px;
      height:var(--nav-h);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:7px 9px;
      border:1px solid transparent;
      border-radius:18px;
      background:rgba(10,9,14,.18);
      backdrop-filter:blur(10px);
      transition:.3s;
    }

    .nav.scrolled{
      border-color:var(--line);
      background:rgba(10,9,14,.64);
      box-shadow:0 12px 40px rgba(0,0,0,.18);
      backdrop-filter:blur(12px);
    }

    .back-link{
      color:var(--muted);
      font-size:.95rem;
      padding:10px 16px;
      border-radius:12px;
      display:flex;
      align-items:center;
      gap:8px;
      transition:.25s;
    }

    .back-link:hover{
      color:var(--text);
      background:rgba(155,108,255,.08);
    }

    .arrow{
      opacity:0;
      width:0;
      overflow:hidden;
      transform:translateX(10px);
      transition:.25s;
    }

    .back-link:hover .arrow{
      opacity:1;
      width:14px;
      transform:none;
    }

    /* ORBS */

    .ambient{
      position:fixed;
      inset:0;
      pointer-events:none;
      overflow:hidden;
      z-index:-2;
    }

    .orb{
      position:absolute;
      border-radius:50%;
      opacity:.22;
      animation:float 12s ease-in-out infinite;
    }

    .orb.one{
      width:300px;
      height:300px;
      background:radial-gradient(circle,var(--purple),transparent 68%);
      top:12%;
      right:-90px;
    }

    .orb.two{
      width:240px;
      height:240px;
      background:radial-gradient(circle,#5d3bd0,transparent 68%);
      bottom:12%;
      left:-100px;
      animation-delay:-5s;
    }

    .orb.three{
      width:140px;
      height:140px;
      background:radial-gradient(circle,#c7a7ff,transparent 68%);
      top:48%;
      right:14%;
      opacity:.1;
      animation-delay:-8s;
    }

    @keyframes float{
      0%,100%{
        transform:translate3d(0,0,0) scale(1);
      }
      50%{
        transform:translate3d(25px,-35px,0) scale(1.08);
      }
    }

    /* HERO */

    .hero{
      min-height:40vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:90px 0 50px;
    }

    .kicker{
      color:var(--purple-2);
      font-size:.82rem;
      font-weight:700;
      letter-spacing:.12em;
      text-transform:uppercase;
    }

    h1{
      font-family:"Instrument Serif",serif;
      font-weight:400;
      font-size:clamp(4rem,8vw,7rem);
      line-height:.88;
      letter-spacing:-.055em;
      margin:20px 0 12px;
    }

    .subtitle{
      color:var(--muted);
      max-width:700px;
      line-height:1.8;
      font-size:1.05rem;
    }

    .hero-actions{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      justify-content:center;
      margin-top:30px;
    }

    .button{
      border:1px solid var(--line);
      padding:12px 17px;
      border-radius:12px;
      transition:.25s;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      position:relative;
      overflow:hidden;
    }

    .button::after{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(
      110deg,
      transparent 25%,
      rgba(255,255,255,.15),
      transparent 75%);
      transform:translateX(-120%);
      transition:transform .55s;
    }

    .button:hover::after{
      transform:translateX(120%);
    }

    .button:hover{
      transform:translateY(-2px);
      border-color:rgba(180,145,255,.45);
    }

    .button.primary{
      background:var(--text);
      color:#111;
      border-color:transparent;
      font-weight:700;
    }

    /* RESUME */

    .resume-section{
      padding:40px 0 100px;
    }

    .resume-frame{
      padding:14px;
      border:1px solid var(--line);
      border-radius:28px;
      background:
      linear-gradient(
      145deg,
      rgba(255,255,255,.07),
      rgba(255,255,255,.018)
      );
      box-shadow:0 35px 80px rgba(0,0,0,.4);
      overflow:hidden;
    }

    .resume-frame img{
      width:100%;
      display:block;
      border-radius:18px;
    }

    .preview-note{
      text-align:center;
      margin-top:18px;
      color:var(--muted);
      font-size:.9rem;
    }

    footer{
      display:flex;
      justify-content:space-between;
      gap:20px;
      padding:30px 0 45px;
      color:#6f6b77;
      font-size:.85rem;
    }

    .footer-links{
      display:flex;
      gap:18px;
    }

    .footer-links a:hover{
      color:var(--text);
    }

    .reveal{
      opacity:0;
      transform:translateY(18px);
      transition:.72s;
    }

    .reveal.visible{
      opacity:1;
      transform:none;
    }

    @media(max-width:700px){

      .container{
        width:min(100% - 24px,var(--max));
      }

      footer{
        flex-direction:column;
      }

      .hero-actions{
        flex-direction:column;
        width:100%;
      }

      .hero-actions a{
        width:100%;
      }
    }
  </style>
</head>

<body>

<div class="ambient">
  <div class="orb one"></div>
  <div class="orb two"></div>
  <div class="orb three"></div>
</div>

<div class="container">

  <nav class="nav" id="nav">
    <a class="back-link" href="index.html">
      <span class="arrow">←</span>
      Back to portfolio
    </a>
  </nav>

  <main>

    <section class="hero reveal">

      <div class="kicker">
        Resume
      </div>

      <h1>Enoch K</h1>

      <p class="subtitle">
        Resume & Professional Profile
      </p>

      <div class="hero-actions">
        <a class="button" href="index.html">
          Portfolio
        </a>

        <a
          class="button primary"
          href="assets/Enoch Resume.pdf"
          download>
          Download PDF
        </a>
      </div>

    </section>

    <section class="resume-section reveal">

      <div class="resume-frame">
        <img
          src="assets/Enoch Resume.png"
          alt="Enoch Resume Preview">
      </div>

      <p class="preview-note">
        Resume preview · Download the PDF for the original document.
      </p>

    </section>

  </main>

  <footer>
    <div>
      © <span id="year"></span> Enoch K. Built with curiosity.
    </div>

    <div class="footer-links">
      <a href="index.html">Portfolio</a>
      <a href="https://github.com/EnochKGM" target="_blank">Socials</a>
      <a href="mailto:enochkgm@gmail.com">Contact</a>
    </div>
  </footer>

</div>

<script>

document.getElementById('year').textContent =
new Date().getFullYear();

const nav = document.getElementById('nav');

const syncNav = () =>
nav.classList.toggle('scrolled', window.scrollY > 8);

syncNav();

window.addEventListener(
'scroll',
syncNav,
{passive:true}
);

window.addEventListener(
'pointermove',
e=>{
document.body.style.setProperty('--mx',`${e.clientX}px`);
document.body.style.setProperty('--my',`${e.clientY}px`);
},
{passive:true}
);

const observer = new IntersectionObserver(entries=>{
entries.forEach(entry=>{
if(entry.isIntersecting){
entry.target.classList.add('visible');
}
});
},{
threshold:.15
});

document
.querySelectorAll('.reveal')
.forEach(el=>observer.observe(el));

</script>

</body>
</html>
